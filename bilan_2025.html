<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMPT — Données vague 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; overflow: hidden; background: #ffffff; }
        .wrapper {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        iframe {
            border: none;
            width: 133%;
            height: 133%;
            display: block;
            transform: scale(0.75);
            transform-origin: top left;
        }
        /* Masque la barre du bas d'Excel Online
           (bouton "Visualiser en plein écran") */
        .mask-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 26px;
            background: #ffffff;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
<iframe width="402" height="346" frameborder="0" scrolling="no" src="https://1drv.ms/x/c/e58ad342c80c76d5/IQQMDQH3AfXZQIw5R_fl0G3MAUp5kPfztXWz2nyuECLamP4?em=1&AllowTyping=False&wdHideGridlines=True&wdHideHeaders=True&wdInConfigurator=True&wdInConfigurator=True&edaebf=rslc0"></iframe>
        <div class="mask-bottom"></div>
    </div>
</body>
</html>
